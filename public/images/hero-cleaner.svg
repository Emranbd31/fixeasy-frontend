<svg width="1200" height="1600" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cleaning professional preparing supplies</title>
  <desc id="desc">Minimal illustration of a cleaner with spray bottles, towels, and sparkling gradients.</desc>
  <defs>
    <linearGradient id="bgClean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
