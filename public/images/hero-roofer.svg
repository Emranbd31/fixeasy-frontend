<svg width="1200" height="1600" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Roofing specialist inspecting shingles</title>
  <desc id="desc">Stylised rooftops, shingles, and safety gear over a dramatic twilight gradient.</desc>
  <defs>
    <linearGradient id="bgRoof" x1="0" y1="0" x2="1" y2="1">
