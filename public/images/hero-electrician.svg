<svg width="1200" height="1600" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Electrician repairing circuit board</title>
  <desc id="desc">Illustrated electrician tools on a deep electric blue gradient background with glowing wiring.</desc>
  <defs>
    <linearGradient id="bgElectric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="48%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <radialGradient id="glowElectric" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(248, 250, 252, 0.4)" />
      <stop offset="70%" stop-color="rgba(14, 165, 233, 0.1)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.05)" />
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f97316" />
