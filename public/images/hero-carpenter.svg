<svg width="1200" height="1600" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Carpenter marking timber boards</title>
  <desc id="desc">Illustration showing carpentry tools, timber textures, and precise measurements on a warm studio gradient.</desc>
  <defs>
