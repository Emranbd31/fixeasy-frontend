name: CI-CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  playwright-api-tests:
    runs-on: ubuntu-latest
    name: Playwright API Tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build (frontend)
        run: npm run build

      - name: Run Playwright API test for /api/admin/verify
        env:
          PLAYWRIGHT_TEST: '1'
          ADMIN_USER: 'admin@fixeasy.irish'
          ADMIN_PASS: 'Shuki@112'
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BASE_URL: 'https://fixeasy.irish'
        run: |
          npx playwright test tests/admin_verify.spec.ts --reporter=list --workers=1

  backend-deploy:
    needs: [playwright-api-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.BACKEND_IMAGE_NAME }}:latest ./backend
          docker push ${{ secrets.BACKEND_IMAGE_NAME }}:latest

      - name: Deploy to VPS via SSH and Docker Compose
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} '
            cd /srv/backend &&
            docker compose pull &&
            docker compose up -d
          '
